<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lavish-design" content="off">
<title>OG Preview Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500&family=Literata:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F4EDE0; --card: #FBF7EF; --ink: #1F1B16; --muted: #6B6258; --line: #D9CFBF; --stage: #E7DFD0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stage); color: var(--ink); font-family: 'Literata', serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; margin: 0 0 4px; }
  h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 0; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 18px; max-width: 780px; line-height: 1.5; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .controls button { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .controls button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .option { margin-bottom: 56px; min-width: 0; }
  .option-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .note { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 12px; max-width: 820px; }
  .frame { position: relative; width: 100%; aspect-ratio: 1200 / 630; border-radius: 10px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.16); }
  .frame svg { display: block; width: 100%; height: 100%; }
  .crop { position: absolute; inset: 0; pointer-events: none; display: none; }
  body.show-crop .crop { display: block; }
  .crop::before, .crop::after { content: ''; position: absolute; top: 0; bottom: 0; width: 23.75%; background: rgba(31,27,22,.55); }
  .crop::before { left: 0; } .crop::after { right: 0; }
  .unfurls { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 16px; align-items: start; }
  @media (max-width: 760px) { .unfurls { grid-template-columns: minmax(0, 1fr); } }
  .unfurl { background: #fff; border: 1px solid #e3e3e3; border-radius: 14px; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; min-width: 0; }
  .unfurl svg { display: block; width: 100%; height: auto; }
  .unfurl .meta { padding: 10px 12px; font-size: 13px; line-height: 1.35; color: #536471; }
  .unfurl .meta b { display: block; color: #0f1419; font-weight: 600; }
  .unfurl .tag { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #8a8a8a; padding: 8px 12px 0; }
  .wa { display: flex; gap: 10px; padding: 10px; background: #e7ffdb; border-radius: 12px; border: none; }
  .wa .thumb { width: 84px; height: 84px; flex: none; border-radius: 6px; overflow: hidden; }
  .wa .thumb svg { width: 84px; height: 84px; }
  .wa .meta { padding: 0; color: #54656f; }
  .wa .meta b { color: #111b21; }
  .slack { border-left: 4px solid #ddd; border-radius: 0; border-top: none; border-right: none; border-bottom: none; padding-left: 10px; background: transparent; }
  .slack .meta { padding: 0 0 8px; }
  .slack svg { max-width: 360px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Share preview — three compositions</h1>
  <p class="sub">1200×630, Paper palette, drawn from the DESIGN.md tokens and the real wordmark glyph. Turn on the square crop to see what WhatsApp's thumbnail keeps. Each option also shows roughly how it would look in X, Slack and WhatsApp.</p>
  <div class="controls">
    <button id="crop-toggle">Show square crop</button>
  </div>
  <div id="options"></div>
</div>

<script>
const T = {
  paper: '#F4EDE0', card: '#FBF7EF', ink: '#1F1B16', muted: '#6B6258', line: '#D9CFBF',
  life: '#3F6B3A', cosmos: '#2E3A7A',
};
const SERIF = "Fraunces, serif", MONO = "'IBM Plex Mono', monospace";
const TITLE = 'Tangent — Wikipedia, one swipe at a time';
const DESC = 'Swipe left to follow a link, and see where you end up. No account, nothing to install.';

function glyph(x, y, size, color) {
  const s = size / 24;
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round">
    <circle cx="10" cy="13" r="6.5"/><line x1="10" y1="6.5" x2="21" y2="6.5"/>
    <circle cx="21" cy="6.5" r="1.8" fill="${color}" stroke="none"/></g>`;
}

function wordmark(x, y, size) {
  return `${glyph(x, y - size * 0.86, size * 1.05, T.ink)}
    <text x="${x + size * 1.15}" y="${y}" font-family="${SERIF}" font-weight="700" font-size="${size}" fill="${T.ink}">tangent</text>`;
}

const ICONS = {
  paw: (c) => `<g fill="${c}"><ellipse cx="0" cy="8" rx="11" ry="9" opacity=".35"/><ellipse cx="0" cy="8" rx="11" ry="9" fill="none" stroke="${c}" stroke-width="2.5"/>
    <circle cx="-13" cy="-6" r="4.5"/><circle cx="-5" cy="-14" r="4.5"/><circle cx="5" cy="-14" r="4.5"/><circle cx="13" cy="-6" r="4.5"/></g>`,
  atom: (c) => `<g fill="none" stroke="${c}" stroke-width="2.5"><ellipse rx="20" ry="8"/><ellipse rx="20" ry="8" transform="rotate(60)"/><ellipse rx="20" ry="8" transform="rotate(-60)"/>
    <circle r="4" fill="${c}" stroke="none"/></g>`,
};

function card({ x, y, w, h, rot = 0, territory, title, topic, mins, why, icon, opacity = 1 }) {
  const pad = 20, blockW = w - pad * 2, blockH = Math.round(blockW * 10 / 16);
  const titleLines = title.map((line, i) =>
    `<text x="${pad + 18}" y="${pad + blockH - 22 - (title.length - 1 - i) * 38}" font-family="${SERIF}" font-weight="600" font-size="34" fill="${T.card}">${line}</text>`).join('');
  const metaY = pad + blockH + 34;
  const bars = [0.94, 0.88, 0.97, 0.62].map((f, i) =>
    `<rect x="${pad}" y="${metaY + 26 + i * 27}" width="${Math.round(blockW * f)}" height="9" rx="4.5" fill="${T.line}"/>`).join('');
  return `<g transform="translate(${x} ${y}) rotate(${rot} ${w / 2} ${h / 2})" opacity="${opacity}">
    <rect width="${w}" height="${h}" rx="20" fill="${T.card}" filter="url(#lift)"/>
    <rect x="${pad}" y="${pad}" width="${blockW}" height="${blockH}" rx="14" fill="${territory}"/>
    ${titleLines}
    <g transform="translate(${pad + blockW - 40} ${pad + 40})">${ICONS[icon](T.card)}</g>
    <circle cx="${pad + 4}" cy="${metaY - 4}" r="4" fill="${territory}"/>
    <text x="${pad + 14}" y="${metaY}" font-family="${MONO}" font-weight="500" font-size="12" letter-spacing="1" fill="${territory}">${topic} <tspan fill="${T.muted}">· ${mins} MIN</tspan></text>
    ${bars}
    <text x="${pad}" y="${h - pad - 2}" font-family="${MONO}" font-size="12" letter-spacing="0.9" fill="${T.muted}">${why}</text>
  </g>`;
}

const octopus = { territory: T.life, title: ['Octopus'], topic: 'ANIMALS', mins: 6, why: '★ YOU LIKE ANIMALS', icon: 'paw' };
const cephalopod = { territory: T.cosmos, title: ['Cephalopod', 'intelligence'], topic: 'SCIENCE', mins: 4, why: '↳ LINKED FROM OCTOPUS', icon: 'atom' };

function route(x, y, crumbs, size = 13) {
  let cx = x, out = '';
  crumbs.forEach((c, i) => {
    const w = c.length * size * 0.62;
    out += `<text x="${cx}" y="${y}" font-family="${MONO}" font-weight="500" font-size="${size}" letter-spacing="1" fill="${i === crumbs.length - 1 ? T.ink : T.muted}">${c}</text>`;
    cx += w + 14;
    if (i < crumbs.length - 1) {
      for (let d = 0; d < 5; d++) out += `<circle cx="${cx + d * 7}" cy="${y - size * 0.35}" r="1.4" fill="${T.muted}"/>`;
      cx += 5 * 7 + 10;
    }
  });
  return out;
}

const DEFS = `<defs><filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#D9CFBF"/>
  <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1F1B16" flood-opacity=".10"/></filter></defs>`;

function pitch(x, y, lines, size, italic = false) {
  return lines.map((l, i) => `<text x="${x}" y="${y + i * size * 1.18}" font-family="${SERIF}" font-weight="600" ${italic ? 'font-style="italic"' : ''} font-size="${size}" fill="${T.ink}">${l}</text>`).join('');
}

const COMPOSITIONS = [
  {
    id: 'a', name: 'A · Bands', tag: 'what we agreed',
    note: 'Wordmark and pitch on the left, Octopus tilted mid-swipe in the centre with Cephalopod intelligence underneath, and the route along the bottom right. TAKE A TANGENT → shows behind the card, as it does in the app during a drag.',
    svg: () => `${DEFS}<rect width="1200" height="630" fill="${T.paper}"/>
      ${wordmark(56, 96, 40)}
      ${pitch(56, 330, ['Wikipedia,', 'one swipe', 'at a time'], 40)}
      ${card({ x: 640, y: 80, w: 330, h: 470, ...cephalopod })}
      <text x="660" y="600" font-family="${MONO}" font-weight="500" font-size="14" letter-spacing="1.2" fill="${T.life}">TAKE A TANGENT →</text>
      ${card({ x: 330, y: 74, w: 330, h: 470, rot: -6, ...octopus })}
      ${route(905, 600, ['OCTOPUS', '?'], 13)}`,
  },
  {
    id: 'b', name: 'B · Mid-drag', tag: 'closest to the app',
    note: 'Re-creates the drag itself: Octopus pulled left and tilted, revealing the next column behind it, with the label and the next titles at 40 % as in DESIGN.md §6. Wordmark at the top left, a large pitch at the bottom left.',
    svg: () => `${DEFS}<rect width="1200" height="630" fill="${T.paper}"/>
      ${wordmark(56, 92, 34)}
      ${pitch(56, 470, ['Wikipedia,', 'one swipe', 'at a time.'], 44, true)}
      <text x="640" y="190" font-family="${MONO}" font-weight="500" font-size="15" letter-spacing="1.2" fill="${T.life}">TAKE A TANGENT →</text>
      <g opacity=".4">
        <text x="640" y="262" font-family="${SERIF}" font-weight="600" font-size="34" fill="${T.ink}">Cephalopod</text>
        <text x="640" y="302" font-family="${SERIF}" font-weight="600" font-size="34" fill="${T.ink}">intelligence</text>
        <text x="640" y="372" font-family="${SERIF}" font-weight="600" font-size="30" fill="${T.ink}">Chromatophore</text>
        <text x="640" y="436" font-family="${SERIF}" font-weight="600" font-size="30" fill="${T.ink}">Ink sac</text>
        <text x="640" y="500" font-family="${SERIF}" font-weight="600" font-size="30" fill="${T.ink}">Octopus arm</text>
      </g>
      ${card({ x: 300, y: 70, w: 330, h: 490, rot: -7, ...octopus })}
      ${route(940, 600, ['OCTOPUS', '…'], 13)}`,
  },
  {
    id: 'c', name: 'C · Route', tag: 'calmest',
    note: 'Two upright cards joined by the dotted route, then a dashed empty card for "where next". Wordmark and pitch run across the top in one line. The square crop loses the wordmark but keeps both cards.',
    svg: () => `${DEFS}<rect width="1200" height="630" fill="${T.paper}"/>
      ${wordmark(56, 84, 34)}
      <text x="292" y="84" font-family="${SERIF}" font-weight="600" font-style="italic" font-size="34" fill="${T.ink}">Wikipedia, one swipe at a time</text>
      ${card({ x: 290, y: 140, w: 290, h: 430, ...octopus })}
      ${Array.from({ length: 6 }, (_, d) => `<circle cx="${590 + d * 8}" cy="355" r="1.8" fill="${T.muted}"/>`).join('')}
      ${card({ x: 640, y: 140, w: 290, h: 430, ...cephalopod })}
      ${Array.from({ length: 6 }, (_, d) => `<circle cx="${940 + d * 8}" cy="355" r="1.8" fill="${T.muted}"/>`).join('')}
      <rect x="1000" y="140" width="290" height="430" rx="20" fill="none" stroke="${T.line}" stroke-width="2" stroke-dasharray="8 8"/>
      <text x="1050" y="370" font-family="${SERIF}" font-weight="600" font-size="64" fill="${T.line}">?</text>`,
  },
];

function svgEl(c, extra = '') {
  return `<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" ${extra}>${c.svg()}</svg>`;
}
function squareEl(c) {
  return `<svg viewBox="285 0 630 630" xmlns="http://www.w3.org/2000/svg">${c.svg()}</svg>`;
}

document.getElementById('options').innerHTML = COMPOSITIONS.map((c) => `
  <section class="option" data-option="${c.id}">
    <div class="option-head"><h2>${c.name}</h2><span class="mono">${c.tag}</span></div>
    <p class="note">${c.note}</p>
    <div class="frame">${svgEl(c)}<div class="crop"></div></div>
    <div class="unfurls">
      <div class="unfurl"><div class="tag">X</div>${svgEl(c)}<div class="meta">gotangent.app<b>${TITLE}</b></div></div>
      <div class="unfurl slack"><div class="meta"><b>Tangent</b>${TITLE}<br>${DESC}</div>${svgEl(c)}</div>
      <div class="unfurl wa"><div class="thumb">${squareEl(c)}</div><div class="meta"><b>${TITLE}</b>${DESC}<br>gotangent.app</div></div>
    </div>
  </section>`).join('');

document.getElementById('crop-toggle').addEventListener('click', (e) => {
  const on = document.body.classList.toggle('show-crop');
  e.currentTarget.classList.toggle('on', on);
  e.currentTarget.textContent = on ? 'Hide square crop' : 'Show square crop';
});
</script>
</body>
</html>
