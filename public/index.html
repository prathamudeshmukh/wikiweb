<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Swipe left to follow a link, and see where you end up. No account, nothing to install." />
    <!-- Share preview: one static card for every URL, naming the canonical apex (SPEC.md §15.6). Image from `npm run og`. -->
    <link rel="canonical" href="https://gotangent.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tangent" />
    <meta property="og:url" content="https://gotangent.app/" />
    <meta property="og:title" content="Tangent — Wikipedia, one swipe at a time" />
    <meta property="og:description" content="Swipe left to follow a link, and see where you end up. No account, nothing to install." />
    <meta property="og:image" content="https://gotangent.app/og/tangent-preview-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An Octopus card swiping left to reveal Cephalopod intelligence" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tangent — Wikipedia, one swipe at a time" />
    <meta name="twitter:description" content="Swipe left to follow a link, and see where you end up. No account, nothing to install." />
    <meta name="twitter:image" content="https://gotangent.app/og/tangent-preview-v1.png" />
    <meta name="twitter:image:alt" content="An Octopus card swiping left to reveal Cephalopod intelligence" />
    <!-- Installable, no service worker (SPEC.md §15.6). Colours are the paper and night palettes. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tangent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F4EDE0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1712" media="(prefers-color-scheme: dark)" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Paper before the app draws, and either side of its column on a wide screen. */
      html {
        background-color: #F4EDE0;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #1B1712;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
