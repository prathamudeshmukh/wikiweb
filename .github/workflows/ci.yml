name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage thresholds)
        run: npm run test:coverage -- --ci

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  android-apk:
    name: Build & release Android APK
    needs: checks
    # Releases are cut by hand: Actions → CI → Run workflow. Pushes and pull requests stop at the checks.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The free EAS plan builds from a low-priority queue, so the wait can be long.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Require the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::Set the EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens)."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Builds and signs on Expo's servers with the keystore EAS holds; EXPO_PUBLIC_* values come from the "preview" EAS environment.
      - name: Build APK on EAS
        id: build
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          echo "url=$(jq -r '.[0].artifacts.buildUrl' build.json)" >> "$GITHUB_OUTPUT"

      - name: Download the APK
        id: apk
        run: |
          version=$(node -p "require('./app.json').expo.version")
          tag="v${version}-build.${{ github.run_number }}"
          file="tangent-${tag}.apk"
          curl --fail --location --silent --show-error --output "$file" "${{ steps.build.outputs.url }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Tangent ${{ steps.apk.outputs.tag }}" \
            --generate-notes \
            --prerelease
