name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  JAVA_VERSION: 17
  VERCEL_CLI_VERSION: 63.1.2

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage thresholds)
        run: npm run test:coverage -- --ci

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  web:
    name: Deploy web to Vercel
    needs: checks
    # Pull requests get a preview, main goes to production. A manual run is an APK release only.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - name: Require the Vercel secrets
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: |
          echo "::error::Set the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets (vercel link writes the IDs to .vercel/project.json)."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm install -g vercel@${{ env.VERCEL_CLI_VERSION }}

      - run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"

      # Runs vercel.json's npm ci and expo export; EXPO_PUBLIC_* values are baked into the bundle here.
      - name: Build
        env:
          EXPO_PUBLIC_WIKI_API_CONTACT: ${{ secrets.EXPO_PUBLIC_WIKI_API_CONTACT }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
        run: vercel build ${{ env.VERCEL_TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ env.VERCEL_TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $VERCEL_TARGET: $url" >> "$GITHUB_STEP_SUMMARY"

  android-apk:
    name: Build & release Android APK
    needs: checks
    # Releases are cut by hand: Actions → CI → Run workflow. Pushes and pull requests stop at the checks.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Compiles every native module from source on the runner; the first build with no Gradle cache is the slow one.
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.apk.outputs.tag }}
      file: ${{ steps.apk.outputs.file }}
    steps:
      - name: Require the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::Set the EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens)."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Builds on this runner (no EAS queue), signed with the keystore EAS holds; EXPO_PUBLIC_* values come from the "preview" EAS environment.
      - name: Build APK with EAS (local)
        id: apk
        run: |
          version=$(node -p "require('./app.json').expo.version")
          tag="v${version}-build.${{ github.run_number }}"
          file="tangent-${tag}.apk"
          eas build --platform android --profile preview --local --non-interactive --output "$file"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Tangent ${{ steps.apk.outputs.tag }}" \
            --generate-notes \
            --prerelease

  notify-slack:
    name: Post APK result to Slack
    needs: [checks, android-apk]
    # always() so a failed checks job (which skips the APK job) is still reported.
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Soft-fails: the release is the source of truth, so a Slack problem is a warning, never a red run.
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          APK_RESULT: ${{ needs.android-apk.result }}
          TAG: ${{ needs.android-apk.outputs.tag }}
          FILE: ${{ needs.android-apk.outputs.file }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set, so no Slack message was posted."
            exit 0
          fi

          commit="\`$BRANCH\` @ \`${SHA:0:7}\`"
          if [ "$APK_RESULT" = success ]; then
            text=$(printf '📦 *Tangent %s* is ready\n<%s|Download APK>\n<%s|Release notes> · %s' \
              "$TAG" "$REPO_URL/releases/download/$TAG/$FILE" "$REPO_URL/releases/tag/$TAG" "$commit")
          else
            if [ "$CHECKS_RESULT" != success ]; then
              stage=checks result=$CHECKS_RESULT
            else
              stage="APK build" result=$APK_RESULT
            fi
            outcome=$([ "$result" = cancelled ] && echo "was cancelled" || echo failed)
            text=$(printf '❌ *Tangent APK build #%s %s* (at: %s)\n<%s|View run log>\n%s' \
              "$RUN_NUMBER" "$outcome" "$stage" "$REPO_URL/actions/runs/$RUN_ID" "$commit")
          fi

          payload=$(jq -n --arg text "$text" '{text: $text}')
          if ! curl --silent --show-error --fail-with-body --max-time 30 \
            -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"; then
            echo "::warning::Slack rejected the APK notification. The release itself is unaffected."
          fi
